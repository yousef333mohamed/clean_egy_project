name: wasteops-production
services:
  reverse_proxy:
    image: nginx:1.28.0-alpine3.21
    environment: { PUBLIC_HOST: "${PUBLIC_HOST:?PUBLIC_HOST is required}", NGINX_ENVSUBST_FILTER: "PUBLIC_HOST" }
    user: "101:101"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - tls_cert:/run/tls:ro
    ports: ["80:80", "443:443"]
    networks: [public, internal]
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /var/log/nginx]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  frontend:
    image: "${IMAGE_REGISTRY:?registry required}/wasteops-frontend:${IMAGE_TAG:?immutable image tag required}"
    environment:
      AUTH_ENABLED: "true"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://${PUBLIC_HOST}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?required}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?required}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-wasteops-api}"
      BACKEND_INTERNAL_URL: http://backend:8000
    secrets: [auth_secret, oidc_client_secret]
    command: ["sh", "-ec", "export AUTH_SECRET=$$(cat /run/secrets/auth_secret); export OIDC_CLIENT_SECRET=$$(cat /run/secrets/oidc_client_secret); exec node server.js"]
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, retries: 5 }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  backend:
    image: "${IMAGE_REGISTRY}/wasteops-backend:${IMAGE_TAG}"
    environment:
      APP_ENVIRONMENT: production
      AUTH_ENABLED: "true"
      ALLOW_DEVELOPMENT_AUTH: "false"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:?required}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-wasteops-api}"
      CORS_ALLOWED_ORIGINS: "https://${PUBLIC_HOST}"
      TRUSTED_HOSTS: "${PUBLIC_HOST},backend"
      ENABLE_RETRIEVAL_DEBUG_API: "false"
      ANALYTICS_ENABLE_DEBUG_API: "false"
      ENABLE_DECISION_DEBUG_API: "false"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SYNC_URL_FILE: /run/secrets/database_sync_url
      REDIS_URL_FILE: /run/secrets/redis_url
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      REDIS_REQUIRED: "true"
      RATE_LIMIT_ENABLED: "true"
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:?required}"
      OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:?required}"
      APP_RELEASE_VERSION: "${RELEASE_VERSION:?required}"
      APP_COMMIT_SHA: "${APP_COMMIT_SHA:?required}"
      APP_BUILD_TIME: "${APP_BUILD_TIME:?required}"
      DATA_SCIENCE_PROVIDER: remote
      ML_SERVICE_BASE_URL: http://ml_service:8001
      ML_SERVICE_TOKEN_FILE: /run/secrets/ml_service_token
      ML_ADMIN_SERVICE_TOKEN_FILE: /run/secrets/ml_admin_service_token
      ML_CLIENT_TIMEOUT_SECONDS: "30"
      ML_CLIENT_MAX_RETRIES: "2"
      ML_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
      ML_CIRCUIT_BREAKER_RECOVERY_SECONDS: "60"
    secrets: [database_url, database_sync_url, redis_url, llm_api_key, metrics_token, ml_service_token, ml_admin_service_token]
    networks: [internal]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml_service: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"], interval: 30s, timeout: 5s, retries: 5 }
    stop_grace_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  ml_service:
    image: "${IMAGE_REGISTRY}/wasteops-ml-service:${IMAGE_TAG}"
    environment:
      ML_SERVICE_ENV: production
      ANALYTICS_DATABASE_URL_FILE: /run/secrets/ml_analytics_database_url
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ARTIFACT_DIRECTORY: /models
      REQUIRE_PRODUCTION_MODELS: "true"
      ALLOWED_MODEL_CHECKSUMS: "${ALLOWED_MODEL_CHECKSUMS:?approved model checksums required}"
      SERVICE_TOKEN_FILE: /run/secrets/ml_service_token
      ADMIN_SERVICE_TOKEN_FILE: /run/secrets/ml_admin_service_token
      MAX_PREDICTION_BATCH_SIZE: "1000"
    volumes: [model_artifacts:/models:ro]
    secrets: [ml_analytics_database_url, ml_service_token, ml_admin_service_token]
    networks: [internal]
    depends_on: { database: { condition: service_healthy }, mlflow: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health/ready', timeout=3)"], interval: 30s, timeout: 5s, retries: 5 }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    environment:
      MLFLOW_S3_ENDPOINT_URL: "${OBJECT_STORAGE_ENDPOINT_URL:?private artifact endpoint required}"
      AWS_DEFAULT_REGION: "${OBJECT_STORAGE_REGION:?required}"
    secrets: [mlflow_database_url, mlflow_s3_access_key, mlflow_s3_secret_key]
    command: [sh, -ec, "export MLFLOW_BACKEND_STORE_URI=$$(cat /run/secrets/mlflow_database_url); export AWS_ACCESS_KEY_ID=$$(cat /run/secrets/mlflow_s3_access_key); export AWS_SECRET_ACCESS_KEY=$$(cat /run/secrets/mlflow_s3_secret_key); exec mlflow server --host 0.0.0.0 --port 5000 --artifacts-destination s3://${MLFLOW_ARTIFACT_BUCKET:?required}"]
    networks: [internal]
    depends_on: { database: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"], interval: 30s, timeout: 5s, retries: 5 }

  worker:
    image: "${IMAGE_REGISTRY}/wasteops-worker:${IMAGE_TAG}"
    environment:
      APP_ENVIRONMENT: production
      AUTH_ENABLED: "true"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL}"
      CORS_ALLOWED_ORIGINS: "https://${PUBLIC_HOST}"
      ENABLE_RETRIEVAL_DEBUG_API: "false"
      ANALYTICS_ENABLE_DEBUG_API: "false"
      ENABLE_DECISION_DEBUG_API: "false"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SYNC_URL_FILE: /run/secrets/database_sync_url
      REDIS_URL_FILE: /run/secrets/redis_url
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      REDIS_REQUIRED: "true"
      RATE_LIMIT_ENABLED: "true"
    secrets: [database_url, database_sync_url, redis_url, llm_api_key]
    networks: [internal]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  scheduler:
    image: "${IMAGE_REGISTRY}/wasteops-worker:${IMAGE_TAG}"
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      APP_ENVIRONMENT: production
      AUTH_ENABLED: "true"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL}"
      CORS_ALLOWED_ORIGINS: "https://${PUBLIC_HOST}"
      ENABLE_RETRIEVAL_DEBUG_API: "false"
      ANALYTICS_ENABLE_DEBUG_API: "false"
      ENABLE_DECISION_DEBUG_API: "false"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SYNC_URL_FILE: /run/secrets/database_sync_url
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_REQUIRED: "true"
      RATE_LIMIT_ENABLED: "true"
    secrets: [database_url, database_sync_url, redis_url]
    networks: [internal]
    depends_on: { database: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  database:
    image: pgvector/pgvector:0.8.0-pg16-bookworm
    environment:
      POSTGRES_DB: wasteops
      POSTGRES_USER: wasteops_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets: [postgres_bootstrap_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck: { test: [CMD-SHELL, "pg_isready -U wasteops_bootstrap -d wasteops"], interval: 10s, timeout: 5s, retries: 10 }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  redis:
    image: redis:7.4.4-alpine3.21
    secrets: [redis_password]
    command: ["sh", "-ec", "exec redis-server --appendonly no --save '' --requirepass \"$$(cat /run/secrets/redis_password)\" --maxmemory 256mb --maxmemory-policy volatile-lru"]
    networks: [internal]
    restart: unless-stopped
    healthcheck: { test: [CMD-SHELL, "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"], interval: 10s, timeout: 5s, retries: 10 }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  migration:
    image: "${IMAGE_REGISTRY}/wasteops-backend:${IMAGE_TAG}"
    profiles: [tools]
    command: [alembic, upgrade, head]
    environment:
      APP_ENVIRONMENT: production
      AUTH_ENABLED: "true"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL}"
      CORS_ALLOWED_ORIGINS: "https://${PUBLIC_HOST}"
      ENABLE_RETRIEVAL_DEBUG_API: "false"
      ANALYTICS_ENABLE_DEBUG_API: "false"
      ENABLE_DECISION_DEBUG_API: "false"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SYNC_URL_FILE: /run/secrets/migration_database_url
      REDIS_REQUIRED: "true"
      RATE_LIMIT_ENABLED: "true"
    secrets: [database_url, migration_database_url]
    networks: [internal]
    depends_on: { database: { condition: service_healthy } }

networks:
  public: {}
  internal: { internal: true }
volumes:
  postgres_data: {}
  tls_cert: { external: true, name: wasteops_tls }
  model_artifacts: { external: true, name: wasteops_model_artifacts }
secrets:
  auth_secret: { external: true }
  oidc_client_secret: { external: true }
  database_url: { external: true }
  database_sync_url: { external: true }
  migration_database_url: { external: true }
  postgres_bootstrap_password: { external: true }
  redis_password: { external: true }
  redis_url: { external: true }
  llm_api_key: { external: true }
  metrics_token: { external: true }
  ml_service_token: { external: true }
  ml_admin_service_token: { external: true }
  ml_analytics_database_url: { external: true }
  mlflow_database_url: { external: true }
  mlflow_s3_access_key: { external: true }
  mlflow_s3_secret_key: { external: true }
