worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
  access_log /var/log/nginx/access.log json;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
  upstream frontend { server frontend:3000; keepalive 16; }
  upstream backend { server backend:8000; keepalive 16; }
  server { listen 80; server_name _; return 301 https://$host$request_uri; }
  server {
    listen 443 ssl http2;
    server_name ${PUBLIC_HOST};
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      proxy_connect_timeout 5s; proxy_send_timeout 30s; proxy_read_timeout 30s;
      proxy_pass http://backend;
    }
    location ~ ^/api/(auth|backend)(/|$) {
      limit_req zone=api burst=30 nodelay;
      proxy_connect_timeout 5s; proxy_send_timeout 120s; proxy_read_timeout 120s;
      proxy_pass http://frontend;
    }
    location ~ ^/api/(chat|decisions|evaluation)/ {
      limit_req zone=api burst=10 nodelay;
      proxy_connect_timeout 5s; proxy_send_timeout 120s; proxy_read_timeout 120s;
      proxy_pass http://backend;
    }
    location /_next/static/ { proxy_pass http://frontend; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { proxy_connect_timeout 5s; proxy_read_timeout 60s; proxy_pass http://frontend; }
  }
}
