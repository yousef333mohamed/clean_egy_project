[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wasteops-ml-service"
version = "0.1.0"
description = "Private, human-governed WasteOps prediction and MLOps service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "joblib>=1.4,<2",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pandera[pandas]>=0.24,<1",
  "mlflow>=3.10,<4", "prometheus-client>=0.21,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.8,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["app", "training"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
extend-ignore = ["E401", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
packages = ["app", "training"]
