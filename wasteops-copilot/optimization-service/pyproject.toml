[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"
[project]
name="wasteops-optimization-service"
version="0.1.0"
requires-python=">=3.12,<3.13"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.32,<1","pydantic>=2.9,<3","pydantic-settings>=2.6,<3","ortools>=9.15,<10"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","httpx>=0.27,<1","ruff>=0.8,<1","mypy>=1.15,<2"]
[tool.hatch.build.targets.wheel]
packages=["app"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
target-version="py312"
line-length=160
[tool.ruff.lint]
extend-ignore=["E701","E702"]
[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
packages=["app"]
