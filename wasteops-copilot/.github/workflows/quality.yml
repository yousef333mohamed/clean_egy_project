name: quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasteops
          POSTGRES_PASSWORD: wasteops
          POSTGRES_DB: wasteops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wasteops -d wasteops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wasteops:wasteops@localhost:5432/wasteops_test
      DATABASE_SYNC_URL: postgresql+psycopg://wasteops:wasteops@localhost:5432/wasteops_test
      EVALUATION_ALLOW_LIVE_PROVIDERS: "false"
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: alembic upgrade head
      - run: python scripts/seed_prompt_versions.py
      - run: python scripts/run_evaluations.py --all
      - run: python scripts/run_evaluations.py --dataset evaluation_datasets/safety/wasteops_safety_v1.json
