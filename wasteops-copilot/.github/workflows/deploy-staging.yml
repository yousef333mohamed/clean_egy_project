name: deploy-staging
on:
  workflow_run: { workflows: [build-images], types: [completed] }
permissions: { contents: read }
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable release through approved staging runner
        env:
          IMAGE_TAG: "${{ github.event.workflow_run.head_sha }}"
          DEPLOY_COMMAND: "${{ secrets.STAGING_DEPLOY_COMMAND }}"
        run: test -n "$DEPLOY_COMMAND" && "$DEPLOY_COMMAND" "$IMAGE_TAG"
      - run: python scripts/smoke_test.py --base-url "${{ vars.STAGING_URL }}"
