[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wasteops-copilot"
version = "0.1.0"
description = "Hybrid RAG decision intelligence for waste-management operations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2", "asyncpg>=0.29,<1", "fastapi>=0.115,<1", "openai>=1.55,<2",
  "pandas>=2.2,<3", "pgvector>=0.3,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6", "python-docx>=1.1,<2", "sqlalchemy[asyncio]>=2.0,<3", "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 160
